    <meta name="twitter:image" content="https://app.zxc.io.vn/404/logo.png">

    <link rel="icon" type="image/png" href="../404/logo.png" />

    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #212121;
            --border-color: #3f3f3f;
            --text-color: #f1f1f1;
            --text-secondary: #aaa;
            --accent-color: #3ea6ff;
            --accent-hover: #65b8ff;
            --success-color: #2ba640;
            --btn-secondary-bg: #2d2d2d;
            --btn-secondary-hover: #3d3d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .btn-paste {
            background-color: var(--btn-secondary-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.2s;
        }

        .btn-paste:hover {
            background-color: var(--btn-secondary-hover);
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        input[type="text"] {
            width: 100%;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .output-box {
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .output-text {
            flex-grow: 1;
            font-family: monospace;
            font-size: 1rem;
            color: #e0e0e0;
            word-break: break-all;
            user-select: all;
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: #0f0f0f;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        button.btn-primary:active {
            transform: scale(0.97);
        }

        button.btn-primary.copied {
            background-color: var(--success-color);
            color: #fff;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌙 Trình Chuyển Đổi Định Dạng Tên (Dark Mode)</h1>

        <div class="form-group">
            <div class="label-row">
                <label for="input-text">Nhập văn bản (Xuống dòng hoặc copy trực tiếp từ Excel):</label>
                <button class="btn-paste" onclick="pasteText()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    Dán nhanh
                </button>
            </div>
            <textarea id="input-text" placeholder="Tiên Giới Tu Tiên | 仙界修仙&#10;Mạc Mặc | 莫默"></textarea>
            <div class="hint">💡 Bấm nút <b>Dán nhanh</b> để tự động xóa nội dung cũ và dán nội dung mới từ clipboard.
            </div>
        </div>

        <div class="form-group">
            <label for="suffix-text">Hậu tố tùy chỉnh (Phía sau cùng):</label>
            <input type="text" id="suffix-text" value="[CHINA]" placeholder="Ví dụ: [CHINA], [VIETNAM], ...">
        </div>

        <div class="form-group">
            <label>Kết quả đầu ra:</label>
            <div class="output-box">
                <span id="output-text" class="output-text">Chưa có nội dung hợp lệ...</span>
                <button id="copy-btn" class="btn-primary" onclick="copyResult()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy
                </button>
            </div>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('input-text');
        const suffixEl = document.getElementById('suffix-text');
        const outputEl = document.getElementById('output-text');
        const copyBtn = document.getElementById('copy-btn');

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                inputEl.value = text;
                processText();
            } catch (err) {
                alert('Trình duyệt không cho phép truy cập clipboard tự động. Bạn hãy click vào ô nhập và dùng phím tắt Ctrl + V nhé!');
            }
        }

        function processText() {
            let rawText = inputEl.value;
            rawText = rawText.replace(/\t/g, '\n');

            const lines = rawText.split('\n');
            let viParts = [];
            let cnParts = [];

            lines.forEach(line => {
                if (!line.trim()) return;
                const parts = line.split('|');
                if (parts.length >= 2) {
                    viParts.push(parts[0].trim());
                    cnParts.push(parts[1].trim());
                } else {
                    viParts.push(line.trim());
                }
            });

            let suffix = suffixEl.value.trim();
            let result = "";

            if (viParts.length > 0 && cnParts.length > 0 && cnParts.some(p => p !== "")) {
                result = `${viParts.join(' - ')} [${cnParts.join('-')}]`;
            } else if (viParts.length > 0) {
                result = viParts.join(' - ');
            } else {
                result = "Chưa có nội dung hợp lệ...";
            }

            if (result !== "Chưa có nội dung hợp lệ..." && suffix !== "") {
                result += ` ${suffix}`;
            }

            outputEl.textContent = result;
        }

        function copyResult() {
            const textToCopy = outputEl.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    Đã Copy!
                `;
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        inputEl.addEventListener('input', processText);
        suffixEl.addEventListener('input', processText);
        processText();
    </script>
</body>

</html>
